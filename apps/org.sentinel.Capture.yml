app-id: org.sentinel.Capture
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-capture
finish-args:
  # Sandbox containment for Sentinel Capture
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-pictures:create
  - --filesystem=xdg-videos:create
  - --filesystem=xdg-config/sentinel/capture:create
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Fdo
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: sentinel-capture
    buildsystem: simple
    build-commands:
      - install -D -m755 bin/sentinel-capture /app/bin/sentinel-capture
      - install -D -m644 packaging/org.sentinel.Capture.desktop /app/share/applications/org.sentinel.Capture.desktop
      - install -D -m644 assets/org.sentinel.Capture.svg /app/share/icons/hicolor/scalable/apps/org.sentinel.Capture.svg
      - install -D -m644 packaging/org.sentinel.Capture.metainfo.xml /app/share/metainfo/org.sentinel.Capture.metainfo.xml
    sources:
      - type: file
        path: bin/sentinel-capture
      - type: file
        path: packaging/org.sentinel.Capture.desktop
      - type: file
        path: assets/org.sentinel.Capture.svg
      - type: file
        path: packaging/org.sentinel.Capture.metainfo.xml
