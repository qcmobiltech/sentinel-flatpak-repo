app-id: org.sentinel.CommandCenter
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-command-center
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=host
modules:
  - name: sentinel-command-center
    buildsystem: simple
    build-commands:
      - install -D -m755 sentinel-command-center /app/bin/sentinel-command-center
    sources:
      - type: file
        path: bin/sentinel-command-center
