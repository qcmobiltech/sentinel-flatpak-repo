app-id: org.sentinel.DesktopWidgets
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-widgets
finish-args:
  # User Realm Confinement: Desktop canvas overlay, Dock tile, procfs monitoring
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=/proc:ro
  - --filesystem=/sys:ro
  - --filesystem=xdg-config/sentinel:create
  - --filesystem=xdg-data/sentinel:create
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.DBus
  - --talk-name=org.mpris.MediaPlayer2.*
modules:
  - name: sentinel-desktop-widgets
    buildsystem: simple
    build-commands:
      - install -D -m755 bin/sentinel-widgets /app/bin/sentinel-widgets
      - install -D -m644 packaging/desktop-widgets.desktop /app/share/applications/org.sentinel.DesktopWidgets.desktop
      - install -D -m644 ui/main.slint /app/share/sentinel/ui/main.slint
    sources:
      - type: file
        path: bin/sentinel-widgets
      - type: file
        path: packaging/desktop-widgets.desktop
      - type: file
        path: ui/main.slint
