app-id: org.sentinel.DockEnhancements
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-dock-enhancements
finish-args:
  # User Realm Confinement: Dock window previews, control IPC, procfs monitoring
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=/proc:ro
  - --filesystem=/sys:ro
  - --filesystem=xdg-config/sentinel:create
  - --filesystem=xdg-data/sentinel:create
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.DBus
  - --talk-name=org.mpris.MediaPlayer2.*
modules:
  - name: sentinel-dock-enhancements
    buildsystem: simple
    build-commands:
      - install -D -m755 bin/sentinel-dock-enhancements /app/bin/sentinel-dock-enhancements
      - install -D -m755 bin/sentinel-dock-ctl /app/bin/sentinel-dock-ctl
      - install -D -m644 packaging/dock-enhancements.desktop /app/share/applications/org.sentinel.DockEnhancements.desktop
      - install -D -m644 ui/main.slint /app/share/sentinel/ui/main.slint
    sources:
      - type: file
        path: bin/sentinel-dock-enhancements
      - type: file
        path: bin/sentinel-dock-ctl
      - type: file
        path: packaging/dock-enhancements.desktop
      - type: file
        path: ui/main.slint
