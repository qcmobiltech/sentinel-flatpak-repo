app-id: org.sentinel.Editor
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-editor
finish-args:
  # Sandbox containment for Sentinel Editor
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --filesystem=xdg-config/sentinel:create
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
modules:
  - name: sentinel-editor
    buildsystem: simple
    build-commands:
      - install -D -m755 bin/sentinel-editor /app/bin/sentinel-editor
      - install -D -m644 packaging/org.sentinel.Editor.desktop /app/share/applications/org.sentinel.Editor.desktop
      - install -D -m644 assets/org.sentinel.Editor.svg /app/share/icons/hicolor/scalable/apps/org.sentinel.Editor.svg
      - install -D -m644 packaging/org.sentinel.Editor.metainfo.xml /app/share/metainfo/org.sentinel.Editor.metainfo.xml
    sources:
      - type: file
        path: bin/sentinel-editor
      - type: file
        path: packaging/org.sentinel.Editor.desktop
      - type: file
        path: assets/org.sentinel.Editor.svg
      - type: file
        path: packaging/org.sentinel.Editor.metainfo.xml
