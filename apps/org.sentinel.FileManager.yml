app-id: org.sentinel.FileManager
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sentinel-file-manager

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --filesystem=xdg-run/udisks2:ro
  - --talk-name=org.freedesktop.UDisks2
  - --talk-name=org.sentinel.Terminal

modules:
  - name: sentinel-file-manager
    buildsystem: simple
    build-commands:
      - cargo build --release --verbose
      - install -Dm755 target/release/sentinel-file-manager /app/bin/sentinel-file-manager
      - install -Dm644 packaging/org.sentinel.FileManager.desktop /app/share/applications/org.sentinel.FileManager.desktop
      - install -Dm644 packaging/org.sentinel.FileManager.metainfo.xml /app/share/metainfo/org.sentinel.FileManager.metainfo.xml
      - install -Dm644 assets/org.sentinel.FileManager.svg /app/share/icons/hicolor/scalable/apps/org.sentinel.FileManager.svg
    sources:
      - type: dir
        path: ../../
