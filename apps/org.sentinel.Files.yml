app-id: org.sentinel.Files
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-files
finish-args:
  # User Realm Confinement: Local storage only, root OS hidden
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=xdg-documents:rw
  - --filesystem=xdg-download:rw
  - --filesystem=xdg-pictures:rw
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=com.sentinel.SecurityCore1
modules:
  - name: sentinel-files
    buildsystem: simple
    build-commands:
      - install -D -m755 sentinel-files /app/bin/sentinel-files
    sources:
      - type: file
        path: bin/sentinel-files
