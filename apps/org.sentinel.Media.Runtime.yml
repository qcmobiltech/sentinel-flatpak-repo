app-id: org.sentinel.Media.Runtime
branch: '2027.0'
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
build-extension: true
appstream-compose: false
finish-args:
  # Multimedia capability extension sandbox permissions
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --talk-name=org.sentinel.Broker
modules:
  - name: sentinel-media-runtime
    buildsystem: simple
    build-commands:
      - install -D -m755 packages/media/org.sentinel.Media.Runtime-2027.0.0-x86_64.flatpakref /app/share/flatpak/org.sentinel.Media.Runtime.flatpakref
