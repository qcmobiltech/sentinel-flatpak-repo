app-id: org.sentinel.Office
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-office
finish-args:
  # Office Realm Confinement: Network DENIED, Document Portal Access Only
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.portal.Documents
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=com.sentinel.SecurityCore1

modules:
  - name: sentinel-office
    buildsystem: simple
    build-commands:
      - tar -zxvf sentinel-office-1.1.0-x86_64.spk
      - install -D -m755 usr/bin/sentinel-office /app/bin/sentinel-office
      - cp -r usr/share/* /app/share/
    sources:
      - type: file
        path: ../packages/office/sentinel-office-1.1.0-x86_64.spk
