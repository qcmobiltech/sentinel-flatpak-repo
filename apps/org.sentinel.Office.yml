app-id: org.sentinel.Office
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-office
finish-args:
  # Office Realm Confinement: Network DENIED, Document Portal Access Only
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --talk-name=org.freedesktop.portal.Documents
  - --talk-name=com.sentinel.SecurityCore1
modules:
  - name: sentinel-office
    buildsystem: simple
    build-commands:
      - install -D -m755 sentinel-office /app/bin/sentinel-office
    sources:
      - type: file
        path: bin/sentinel-office
