app-id: org.sentinel.PartitionManager
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sentinel-partition-manager

finish-args:
  # Storage Privileges & Device Management
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-run/udisks2:ro
  - --talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.PolicyKit1
  - --system-talk-name=org.freedesktop.UDisks2
  - --system-talk-name=org.freedesktop.PolicyKit1

modules:
  - name: sentinel-partition-manager
    buildsystem: simple
    build-commands:
      - cargo build --release --verbose
      - install -Dm755 target/release/sentinel-partition-manager /app/bin/sentinel-partition-manager
      - install -Dm644 packaging/org.sentinel.PartitionManager.desktop /app/share/applications/org.sentinel.PartitionManager.desktop
      - install -Dm644 packaging/org.sentinel.PartitionManager.metainfo.xml /app/share/metainfo/org.sentinel.PartitionManager.metainfo.xml
      - install -Dm644 assets/org.sentinel.PartitionManager.svg /app/share/icons/hicolor/scalable/apps/org.sentinel.PartitionManager.svg
    sources:
      - type: dir
        path: ../../
