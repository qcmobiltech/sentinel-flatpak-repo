app-id: org.sentinel.Sdk
branch: '2027.0'
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
build-extension: true
appstream-compose: false
finish-args:
  # Developer SDK environment permissions
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=all
  - --filesystem=host
modules:
  - name: sentinel-developer-framework
    buildsystem: simple
    build-commands:
      - install -d /app/share/sentinel/packages/developer
      - cp -r packages/developer/* /app/share/sentinel/packages/developer/
