app-id: org.sentinel.SoftwareStore
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-software-store
finish-args:
  # Universal Package Vault Surface: Wayland, Fallback-X11, Network, D-Bus
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.PackageKit
  - --system-talk-name=org.freedesktop.PackageKit
  - --system-talk-name=org.sentinel.softwarestore
modules:
  - name: sentinel-software-store
    buildsystem: simple
    build-commands:
      - install -D -m755 sentinel-software-store /app/bin/sentinel-software-store
      - install -D -m644 org.sentinel.SoftwareStore.desktop /app/share/applications/org.sentinel.SoftwareStore.desktop
      - install -D -m644 org.sentinel.SoftwareStore.svg /app/share/icons/hicolor/scalable/apps/org.sentinel.SoftwareStore.svg
    sources:
      - type: file
        path: bin/sentinel-software-store
      - type: file
        path: org.sentinel.SoftwareStore.desktop
      - type: file
        path: org.sentinel.SoftwareStore.svg
