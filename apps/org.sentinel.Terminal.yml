app-id: org.sentinel.Terminal
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-terminal
finish-args:
  # Dev Sandbox Realm Confinement: Unprivileged user namespace
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=com.sentinel.SecurityCore1
modules:
  - name: sentinel-terminal
    buildsystem: simple
    build-commands:
      - install -D -m755 sentinel-terminal /app/bin/sentinel-terminal
    sources:
      - type: file
        path: bin/sentinel-terminal
