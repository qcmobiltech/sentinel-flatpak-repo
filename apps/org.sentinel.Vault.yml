app-id: org.sentinel.Vault
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: sentinel-vault
finish-args:
  # Crypto Realm Confinement: Zero raw network, talks directly to TPM 2.0 PKCS#11
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --talk-name=com.sentinel.SecurityCore1
modules:
  - name: sentinel-vault
    buildsystem: simple
    build-commands:
      - install -D -m755 sentinel-vault /app/bin/sentinel-vault
    sources:
      - type: file
        path: bin/sentinel-vault
