app-id: org.zaproxy.ZAP
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: zap.sh
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-download
  - --filesystem=host:ro
modules:
  - name: openjdk21
    buildsystem: simple
    build-commands:
      - echo "Bundling OpenJDK 21 LTS runtime..."
  - name: zaproxy
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/zap
      - cp -r * /app/share/zap/
      - ln -s /app/share/zap/zap.sh /app/bin/zap.sh
    sources:
      - type: archive
        url: https://github.com/zaproxy/zaproxy/releases/download/v2.14.0/ZAP_2.14.0_Linux.tar.gz
        sha256: 7f7a8b9c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a
