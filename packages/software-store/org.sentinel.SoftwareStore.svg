<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b202e" />
      <stop offset="50%" stop-color="#10131d" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8800" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Source Gradients -->
    <linearGradient id="spk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>

    <linearGradient id="container-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="flatpak-curated-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#008ba3" />
    </linearGradient>

    <linearGradient id="flathub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b388ff" />
      <stop offset="100%" stop-color="#651fff" />
    </linearGradient>

    <!-- Subtle Holographic Grid Pattern -->
    <pattern id="cyber-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#222b40" stroke-width="1" stroke-opacity="0.35" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-core" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Canvas -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#bg-grad)" stroke="url(#rim-grad)" stroke-width="4.5" />
  <rect x="34" y="34" width="444" height="444" rx="90" fill="url(#cyber-grid)" />

  <!-- Inner Ambient Perimeter Shield -->
  <path d="M 256 68 L 416 138 L 416 280 C 416 364 348 424 256 448 C 164 424 96 364 96 280 L 96 138 Z"
        fill="#0f131c" fill-opacity="0.85" stroke="#263148" stroke-width="3" stroke-dasharray="14 6" />

  <!-- Concentric Radar Rings -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#1d263a" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="112" fill="none" stroke="#25314a" stroke-width="1.5" />

  <!-- Quad-Source Power Hub: SPK, Container, Flatpak, Flathub -->

  <!-- Top Node: Sentinel Native SPK (Orange) -->
  <line x1="256" y1="210" x2="256" y2="108" stroke="url(#spk-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow-orange)" />
  <circle cx="256" cy="108" r="13" fill="#181c2b" stroke="url(#spk-grad)" stroke-width="3.5" />
  <circle cx="256" cy="108" r="5" fill="#ffb74d" />
  <text x="256" y="90" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ff9d42" text-anchor="middle" letter-spacing="1.5">SPK NATIVE</text>

  <!-- Right Node: Sentinel Containers (Green/Emerald) -->
  <line x1="298" y1="235" x2="384" y2="190" stroke="url(#container-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow-green)" />
  <circle cx="384" cy="190" r="13" fill="#181c2b" stroke="url(#container-grad)" stroke-width="3.5" />
  <circle cx="384" cy="190" r="5" fill="#34d399" />
  <text x="390" y="168" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">CONTAINER</text>

  <!-- Left Node: Sentinel Flatpak (Cyan) -->
  <line x1="214" y1="235" x2="128" y2="190" stroke="url(#flatpak-curated-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow-cyan)" />
  <circle cx="128" cy="190" r="13" fill="#181c2b" stroke="url(#flatpak-curated-grad)" stroke-width="3.5" />
  <circle cx="128" cy="190" r="5" fill="#00e5ff" />
  <text x="122" y="168" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#00e5ff" text-anchor="middle" letter-spacing="1">SENTINEL-FP</text>

  <!-- Bottom Node: Flathub (Electric Purple) -->
  <line x1="256" y1="300" x2="256" y2="380" stroke="url(#flathub-grad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="256" cy="380" r="13" fill="#181c2b" stroke="url(#flathub-grad)" stroke-width="3.5" />
  <circle cx="256" cy="380" r="5" fill="#b388ff" />
  <text x="256" y="410" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#b388ff" text-anchor="middle" letter-spacing="1.5">FLATHUB</text>

  <!-- Central Isometric Software Package / Vault -->
  <!-- Top Face -->
  <polygon points="256,195 320,230 256,265 192,230" fill="#20293d" stroke="#3d4f73" stroke-width="2.5" />
  
  <!-- Left Face -->
  <polygon points="192,230 256,265 256,330 192,295" fill="#151b29" stroke="#303f5d" stroke-width="2.5" />

  <!-- Right Face -->
  <polygon points="256,265 320,230 320,295 256,330" fill="#1a2233" stroke="#303f5d" stroke-width="2.5" />

  <!-- Seam Lines -->
  <path d="M 256 195 L 256 265" stroke="#4a5f8a" stroke-width="1.8" stroke-dasharray="3 3" />
  <path d="M 192 230 L 320 230" stroke="#4a5f8a" stroke-width="1.4" stroke-dasharray="3 3" />

  <!-- Central Shield & Download Hologram Emblem -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="30" fill="#ff6b00" fill-opacity="0.14" filter="url(#glow-core)" />
    <!-- Hex Shield -->
    <polygon points="0,-20 18,-10 18,10 0,20 -18,10 -18,-10"
             fill="#141a27" stroke="#ff7a00" stroke-width="2.8" filter="url(#glow-orange)" />
    <!-- Download Arrow -->
    <path d="M 0 -9 L 0 7 M -5 2 L 0 7 L 5 2"
          stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-7" y1="11" x2="7" y2="11" stroke="#ff9d42" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 64 88 L 64 64 L 88 64" fill="none" stroke="#ff6b00" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 448 88 L 448 64 L 424 64" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 64 424 L 64 448 L 88 448" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 448 424 L 448 448 L 424 448" fill="none" stroke="#7c4dff" stroke-width="3.5" stroke-linecap="round" />

  <!-- Vault Label -->
  <text x="256" y="468" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="3.5">SENTINEL MULTI-SOURCE VAULT</text>
</svg>
